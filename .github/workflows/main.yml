name: Weather Bansko

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install libraries
        run: |
          python -m pip install pillow requests

      - name: Create weather image
        run: |
          python <<'PY'
          import requests
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          latitude = 41.8384
          longitude = 23.4882

          weather_url = (
              "https://api.open-meteo.com/v1/forecast"
              f"?latitude={latitude}"
              f"&longitude={longitude}"
              "&current=temperature_2m"
              "&timezone=Europe%2FSofia"
          )

          weather = requests.get(weather_url, timeout=30)
          weather.raise_for_status()

          data = weather.json()
          temperature = round(data["current"]["temperature_2m"])

          image_url = (
              "https://i.postimg.cc/y8n9N7S1/"
              "Izobrazenie-ot-Chat-GPT-1-10-2026-g-10-40-55.png"
          )

          image_response = requests.get(image_url, timeout=30)
          image_response.raise_for_status()

          image = Image.open(
              BytesIO(image_response.content)
          ).convert("RGB")

          image = ImageOps.fit(
              image,
              (1200, 1200),
              method=Image.Resampling.LANCZOS
          )

          draw = ImageDraw.Draw(image)

          font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              90
          )

          text = f"{temperature}°C"

          bbox = draw.textbbox((0, 0), text, font=font)
          text_width = bbox[2] - bbox[0]

          x = 1200 - text_width - 70
          y = 110

          draw.text(
              (x, y),
              text,
              font=font,
              fill="white",
              stroke_width=3,
              stroke_fill="black"
          )

          image.save("weather-bansko.png", quality=95)

          print(f"Температура в Банско: {temperature}°C")
          PY

      - name: Save generated image
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather-bansko.png

          if git diff --cached --quiet; then
            echo "Няма промяна."
          else
            git commit -m "Update Bansko weather"
            git push
          fi

      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python <<'PY'
          import os
          import requests

          page_id = os.environ["FB_PAGE_ID"]
          token = os.environ["FB_PAGE_ACCESS_TOKEN"]

          with open("weather-bansko.png", "rb") as image:
              response = requests.post(
                  f"https://graph.facebook.com/v26.0/{page_id}/photos",
                  data={
                      "access_token": token,
                      "caption": "Времето в Банско",
                      "published": "true"
                  },
                  files={
                      "source": (
                          "weather-bansko.png",
                          image,
                          "image/png"
                      )
                  },
                  timeout=60
              )

          print("Facebook status:", response.status_code)
          print("Facebook response:", response.text)

          response.raise_for_status()
          PY
