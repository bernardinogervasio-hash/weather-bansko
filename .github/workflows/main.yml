name: Weather Bansko

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install libraries
        run: |
          python -m pip install pillow requests

      - name: Create background copy
        run: |
          if [ ! -f background.png ]; then
            cp weather-bansko.png background.png
          fi

      - name: Create weather image
        run: |
          python <<'PY'
          import requests
          from PIL import Image, ImageDraw, ImageFont

          latitude = 41.8384
          longitude = 23.4882

          weather_url = (
              "https://api.open-meteo.com/v1/forecast"
              f"?latitude={latitude}"
              f"&longitude={longitude}"
              "&current=temperature_2m"
              "&timezone=Europe%2FSofia"
          )

          response = requests.get(weather_url, timeout=30)
          response.raise_for_status()

          data = response.json()
          temperature = round(data["current"]["temperature_2m"])

          image = Image.open("background.png").convert("RGB")
          draw = ImageDraw.Draw(image)

          font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              90
          )

          text = f"{temperature}°C"

          bbox = draw.textbbox((0, 0), text, font=font)
          text_width = bbox[2] - bbox[0]

          x = 1200 - text_width - 70
          y = 110

          draw.text(
              (x, y),
              text,
              font=font,
              fill="white",
              stroke_width=3,
              stroke_fill="black"
          )

          image.save("weather-bansko.png")

          print(f"Температура в Банско: {temperature}°C")
          PY

      - name: Save generated image
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add weather-bansko.png background.png

          if git diff --cached --quiet; then
            echo "Няма промяна."
          else
            git commit -m "Update Bansko weather"
            git push
          fi
